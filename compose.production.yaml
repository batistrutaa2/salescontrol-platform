name: salescontrol-platform

x-app: &app
  image: ${APP_IMAGE:?Defina APP_IMAGE}:${IMAGE_TAG:?Defina IMAGE_TAG}
  env_file:
    - ${APP_ENV_FILE:-.env}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - app-storage:/var/www/html/storage
  networks:
    - backend
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8010}:8080"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 640m
    cpus: 1.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=whatsapp,default", "--sleep=2", "--tries=5", "--timeout=300", "--max-time=3600", "--memory=256"]
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 5m

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.35
    stop_grace_period: 30s

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    profiles: ["realtime"]
    ports:
      - "127.0.0.1:${REVERB_SERVER_PORT:-8087}:8081"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

  documentos-queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=documentos-transfer,documentos,documentos-scan", "--sleep=2", "--tries=5", "--timeout=600", "--max-time=21600", "--memory=192"]
    profiles: ["documentos"]
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

volumes:
  app-storage:
  redis-data:
