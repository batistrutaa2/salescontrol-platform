name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get current time
        id: current-time
        run: echo "TIME=$(date +'%H:%M:%S %d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification - Starting deployment
        uses: Ilshidur/action-discord@master
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: '🚀 **Iniciando deploy do SalesControl**\nAtualizações detectadas no repositório.'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gmp, sodium, pdo_mysql, gd, zip, xml, curl
          coverage: none

      - name: Validate and install PHP dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test tests/Unit/Documentos

      - name: Validate production Compose contract
        env:
          EVOLUTION_DB_PASSWORD: ci-placeholder
        run: |
          test -f docker-compose.yml
          test -f docker/php83/Dockerfile
          docker compose -f docker-compose.yml config --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        env:
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}
        run: npm run build

      - name: Upload built assets to VPS
        id: upload-assets
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          protocol: tcp4
          timeout: 120s
          command_timeout: 10m
          source: "public/build/"
          target: "/var/www/html/salescontrol-new/public/"
          strip_components: 1

      - name: Retry built assets upload to VPS
        if: steps.upload-assets.outcome == 'failure'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          protocol: tcp4
          timeout: 120s
          command_timeout: 10m
          source: "public/build/"
          target: "/var/www/html/salescontrol-new/public/"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          protocol: tcp4
          timeout: 120s
          command_timeout: "30m"
          script: |
            # Qualquer comando que falhar aborta o deploy IMEDIATAMENTE (sem falha silenciosa)
            set -e

            cd /var/www/html/salescontrol-new

            # docker compose v2 (plugin) ou docker-compose v1 (standalone)
            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo --preserve-env=PWD docker compose -f docker-compose.yml"
            else
              COMPOSE="sudo --preserve-env=PWD docker-compose -f docker-compose.yml"
            fi
            echo "==> Usando: $COMPOSE"


            # Configurar credenciais Git temporariamente
            git config --local credential.helper store
            echo "https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com" > ~/.git-credentials

            # Puxar alterações do repositório
            echo "==> Baixando alterações do repositório..."

            # Estes arquivos são caches gerados pelo Composer/Laravel. Versões
            # antigas do repositório os rastreavam e package:discover os altera
            # na VPS, o que impediria o git pull da correção que os desversiona.
            for CACHE_FILE in bootstrap/cache/packages.php bootstrap/cache/services.php; do
              if git ls-files --error-unmatch "$CACHE_FILE" >/dev/null 2>&1; then
                sudo git restore --source=HEAD --worktree -- "$CACHE_FILE"
              fi
            done

            # Migração única: durante a recuperação do incidente de 10/08/2026,
            # o Compose foi restaurado manualmente na VPS como arquivo não
            # rastreado. Preserve uma cópia antes de receber a versão oficial.
            if [ -f docker-compose.yml ] && ! git ls-files --error-unmatch docker-compose.yml >/dev/null 2>&1; then
              BACKUP_COMPOSE="/tmp/salescontrol-docker-compose.pre-versioned.$(date +%Y%m%d%H%M%S).yml"
              sudo cp docker-compose.yml "$BACKUP_COMPOSE"
              sudo rm docker-compose.yml
              echo "==> Compose manual preservado em $BACKUP_COMPOSE"
            fi

            sudo git pull origin master

            # O Compose é parte obrigatória do contrato de produção. Esta trava
            # impede que uma remoção acidental avance até alterar os containers.
            if [ ! -f docker-compose.yml ]; then
              echo "ERRO: docker-compose.yml de produção não está versionado."
              exit 1
            fi
            if [ ! -f docker/php83/Dockerfile ]; then
              echo "ERRO: Dockerfile de produção não está versionado."
              exit 1
            fi

            # Limpar credenciais após uso
            rm -f ~/.git-credentials

            # Instala sempre o lock antes do build. Isso cobre atualizações
            # incrementais nas quais vendor/ existe, mas ainda não contém um
            # pacote recém-adicionado (como o adapter SFTP).
            echo "==> Instalando dependências PHP antes do build..."
            sudo docker run --rm -v "$PWD":/app -w /app composer:2 \
              composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

            # Limpeza única da geração antiga de containers (compose não-versionado):
            # o container avulso "reverb" segura a porta 6001 e impede o novo de subir.
            if sudo docker ps -a --format '{{.Names}}' | grep -qx 'reverb'; then
              echo "==> Removendo container legado 'reverb'..."
              sudo docker rm -f reverb
            fi

            echo "==> Construindo runtime PHP versionado..."
            $COMPOSE build laravel.test

            # Evolution e seu PostgreSQL estão pausados. Os containers são
            # removidos sem apagar os volumes, preservando dados para uma
            # eventual retomada com um plano explícito.
            echo "==> Pausando Evolution API..."
            $COMPOSE stop evolution evolution-db || true
            $COMPOSE rm -f evolution evolution-db || true

            # Subir/atualizar serviços (reverb, queue, scheduler e redis).
            # Em produção NÃO existe COMPOSE_PROFILES=dev, então mysql/mailpit
            # do compose ficam de fora (o banco é o MySQL externo do host).
            echo "==> Atualizando containers..."
            # Workers documentais só voltam após migration/cache para não executar
            # código novo contra um schema antigo durante o deploy.
            $COMPOSE up -d --remove-orphans --scale documentos-queue=0 --scale documentos-scan=0

            for EXTENSION in openssl sodium gmp; do
              $COMPOSE exec -T laravel.test php -m | grep -qi "^${EXTENSION}$" || {
                echo "ERRO: extensão PHP ${EXTENSION} não está ativa."
                exit 1
              }
            done

            echo "==> Containers ativos:"
            $COMPOSE ps

            # Dependências PHP atualizadas dentro do container do app
            # (sem --no-dev: o próprio Sail é dependência dev e é o runtime da VPS)
            echo "==> Atualizando dependências..."
            $COMPOSE exec -T laravel.test composer install --no-interaction --prefer-dist --optimize-autoloader

            # Executar migrações
            echo "==> Executando migrações..."
            $COMPOSE exec -T laravel.test php artisan migrate --force --no-interaction

            # O pipeline documental só pode receber jobs com ClamAV saudável.
            echo "==> Verificando serviço de documentos..."
            CLAMAV_HEALTH="starting"
            for ATTEMPT in $(seq 1 60); do
              CLAMAV_HEALTH=$(sudo docker inspect --format='{{.State.Health.Status}}' "$($COMPOSE ps -q clamav)")
              [ "$CLAMAV_HEALTH" = "healthy" ] && break
              sleep 5
            done
            if [ "$CLAMAV_HEALTH" != "healthy" ]; then
              echo "ERRO: ClamAV não está saudável."
              $COMPOSE logs --tail=30 clamav
              exit 1
            fi

            # Garantir o symlink public/storage (mídias do WhatsApp)
            $COMPOSE exec -T laravel.test php artisan storage:link || true

            # Limpar caches
            echo "==> Limpando caches..."
            $COMPOSE exec -T laravel.test php artisan optimize:clear

            echo "==> Validando configuração e acesso ao servidor documental..."
            $COMPOSE exec -T laravel.test php artisan documentos:validar-configuracao --production
            $COMPOSE exec -T laravel.test php artisan documentos:testar-conexao

            echo "==> Sincronizando catálogo de pastas documentais..."
            $COMPOSE exec -T laravel.test php artisan documentos:sincronizar-diretorios
            $COMPOSE up -d --scale documentos-queue=2 --scale documentos-scan=2
            $COMPOSE exec -T laravel.test php artisan documentos:processar-pendentes --limit=5000

            # Workers de fila recarregam o código novo (o container reinicia sozinho via restart policy)
            echo "==> Reiniciando workers..."
            $COMPOSE exec -T laravel.test php artisan queue:restart
            sudo docker restart $(sudo docker ps -qf name=reverb) || true

            # Health check DIRETO no container do Laravel (não passa pelo Apache,
            # que responderia 301 e mascararia uma aplicação fora do ar)
            echo "==> Verificando saúde da aplicação..."
            sleep 5
            if curl -sf http://127.0.0.1:8080/up > /dev/null; then
              echo "Aplicação OK!"
            else
              echo "ERRO: aplicação não respondeu em http://127.0.0.1:8080/up"
              $COMPOSE ps
              $COMPOSE logs --tail=30 laravel.test
              exit 1
            fi

            echo "==> Deploy finalizado com sucesso!"

      - name: Send Discord notification - Success
        if: success()
        uses: Ilshidur/action-discord@master
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ **Deploy concluído com sucesso!**
            **Projeto:** SalesControl
            **Branch:** master
            **Hora:** ${{ steps.current-time.outputs.TIME }}

      - name: Send Discord notification - Failure
        if: failure()
        uses: Ilshidur/action-discord@master
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **Falha no deploy!**
            **Projeto:** SalesControl
            **Branch:** master
            **Hora:** ${{ steps.current-time.outputs.TIME }}
            Por favor, verifique os logs para mais detalhes.
