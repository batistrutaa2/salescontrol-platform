name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get current time
        id: current-time
        run: echo "TIME=$(date +'%H:%M:%S %d/%m/%Y')" >> $GITHUB_OUTPUT

      - name: Send Discord notification - Starting deployment
        uses: Ilshidur/action-discord@master
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: '🚀 **Iniciando deploy do SalesControl**\nAtualizações detectadas no repositório.'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Upload built assets to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "public/build/"
          target: "/var/www/html/salescontrol-new/public/"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: "30m"
          script: |
            cd /var/www/html/salescontrol-new

            # Configurar credenciais Git temporariamente
            git config --local credential.helper store
            echo "https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com" > ~/.git-credentials

            # Puxar alterações do repositório
            echo "Baixando alterações do repositório..."
            sudo git pull origin master

            # Limpar credenciais após uso
            rm -f ~/.git-credentials

            # Executar migrações
            # Produção roda PHP direto (Sail é dev-only, não existe aqui).
            echo "Status das migrações (antes):"
            sudo php artisan migrate:status || true

            echo "Executando migrações..."
            if ! sudo php artisan migrate --force --no-interaction; then
              echo "::error::Falha ao executar as migrações — deploy abortado."
              exit 1
            fi
            echo "Migrações concluídas."

            # Limpar caches
            echo "Limpando caches..."
            sudo php artisan optimize:clear
            echo "Caches limpos."

            echo "Deploy finalizado com sucesso!"

      - name: Send Discord notification - Success
        if: success()
        uses: Ilshidur/action-discord@master
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ **Deploy concluído com sucesso!**
            **Projeto:** SalesControl
            **Branch:** master
            **Hora:** ${{ steps.current-time.outputs.TIME }}

      - name: Send Discord notification - Failure
        if: failure()
        uses: Ilshidur/action-discord@master
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **Falha no deploy!**
            **Projeto:** SalesControl
            **Branch:** master
            **Hora:** ${{ steps.current-time.outputs.TIME }}
            Por favor, verifique os logs para mais detalhes.
