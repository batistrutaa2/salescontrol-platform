name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/html/salescontrol-new
            sudo git pull https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/batistrutaa2/salescontrol-new.git master

            # Limpar caches antes de tentar migrar
            ./vendor/bin/sail artisan route:clear
            ./vendor/bin/sail artisan config:clear
            ./vendor/bin/sail artisan cache:clear

            # Executar migrações
            ./vendor/bin/sail artisan migrate --force

            # Compilar assets
            ./vendor/bin/sail npm run build

            # Otimizar após build bem-sucedido
            ./vendor/bin/sail artisan optimize
