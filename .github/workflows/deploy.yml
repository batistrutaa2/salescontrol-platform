name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get current time
        id: current-time
        run: echo "TIME=$(date +'%H:%M:%S %d/%m/%Y')" >> $GITHUB_OUTPUT

      - name: Send Discord notification - Starting deployment
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: '🚀 **Iniciando deploy do SalesControl**\nAtualizações detectadas no repositório.'

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: "60m"
          script: |
            cd /var/www/html/salescontrol-new

            # Salvar hash atual antes do pull
            CURRENT_HASH=$(git rev-parse HEAD)

            # Puxar alterações do repositório
            sudo git pull origin master

            # Verificar se houve alterações
            if [ "$CURRENT_HASH" != "$(git rev-parse HEAD)" ]; then
              echo "Alterações detectadas!"

              # Verificar se há alterações em arquivos JS, CSS ou SCSS
              git diff --name-only $CURRENT_HASH HEAD | grep -E '\.(js|css|scss)$' > /dev/null
              if [ $? -eq 0 ]; then
                echo "Alterações em assets detectadas. Executando build..."
                sudo ./vendor/bin/sail npm run build
                echo "Build de assets concluído."
              else
                echo "Sem alterações em assets. Pulando build."
              fi

              # Executar migrações
              echo "Executando migrações..."
              sudo ./vendor/bin/sail artisan migrate --force
              echo "Migrações concluídas."
            else
              echo "Nenhuma alteração detectada."
            fi

      - name: Send Discord notification - Success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ **Deploy concluído com sucesso!**
            **Projeto:** SalesControl
            **Branch:** master
            **Hora:** ${{ steps.current-time.outputs.TIME }}

      - name: Send Discord notification - Failure
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **Falha no deploy!**
            **Projeto:** SalesControl
            **Branch:** master
            **Hora:** ${{ steps.current-time.outputs.TIME }}
            Por favor, verifique os logs para mais detalhes.
