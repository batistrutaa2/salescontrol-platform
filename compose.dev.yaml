# Ambiente Docker enxuto de desenvolvimento do SalesControl Platform.
# Pré-requisito: infra compartilhada de pé (MySQL brsolutions):
#   docker compose -f ../docker-compose.yml up -d
#
# Uso diário (ou use o wrapper ./dev):
#   docker compose -f compose.dev.yaml up -d              # app + vite
#   docker compose -f compose.dev.yaml --profile queue up -d     # + fila
#   docker compose -f compose.dev.yaml --profile scheduler up -d # + agendador
#   docker compose -f compose.dev.yaml --profile reverb up -d    # + websockets
#
# Portas próprias (8003/5176/8086) para não colidir com outros produtos locais.
name: salescontrol-platform-dev

x-base: &base
  image: salescontrol-platform-dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  user: "1000:1000"
  volumes:
    - .:/var/www/html
  networks:
    - default
    - brsolutions

services:
  app:
    <<: *base
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8003:8000"
    mem_limit: 768m

  vite:
    <<: *base
    command: npm run dev
    ports:
      - "5176:5176"
    mem_limit: 1g

  queue:
    <<: *base
    command: php artisan queue:work --queue=whatsapp,default --tries=5 --timeout=300 --max-time=3600
    profiles: [queue]
    restart: unless-stopped

  documentos-queue:
    <<: *base
    # Compatibilidade temporária com jobs antigos ainda serializados nessa fila.
    command: php artisan queue:work --queue=documentos-transfer,documentos,documentos-scan --tries=5 --timeout=600 --max-time=21600
    profiles: [queue]
    restart: unless-stopped
    mem_limit: 256m

  scheduler:
    <<: *base
    command: php artisan schedule:work
    profiles: [scheduler]
    mem_limit: 192m

  reverb:
    <<: *base
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    profiles: [reverb]
    ports:
      - "8086:8081"
    mem_limit: 256m

networks:
  brsolutions:
    external: true
