# Ambiente Docker enxuto de desenvolvimento do SalesControl.
# Pré-requisito: infra compartilhada de pé (MySQL brsolutions):
#   docker compose -f ../docker-compose.yml up -d
#
# Uso diário (ou use o wrapper ./dev):
#   docker compose -f compose.dev.yaml up -d              # app + vite
#   docker compose -f compose.dev.yaml --profile queue up -d     # + fila
#   docker compose -f compose.dev.yaml --profile scheduler up -d # + agendador
#   docker compose -f compose.dev.yaml --profile reverb up -d    # + websockets
#
# Portas deslocadas (8001/5174/8082) para conviver com o bloo (8000/5173/8080)
# se ambos rodarem ao mesmo tempo.
name: salescontrol-dev

x-base: &base
  image: salescontrol-dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  user: "1000:1000"
  volumes:
    - .:/var/www/html
  networks:
    - default
    - brsolutions

services:
  app:
    <<: *base
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8001:8000"
    mem_limit: 768m

  vite:
    <<: *base
    command: npm run dev
    ports:
      - "5174:5174"
    mem_limit: 1g

  queue:
    <<: *base
    command: php artisan queue:work --queue=whatsapp,default --tries=5 --timeout=300 --max-time=3600
    profiles: [queue]
    restart: unless-stopped

  documentos-scan:
    <<: *base
    command: php artisan queue:work --queue=documentos-scan --tries=5 --timeout=180 --max-time=21600
    profiles: [queue]
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    mem_limit: 256m

  documentos-queue:
    <<: *base
    command: php artisan queue:work --queue=documentos-transfer,documentos --tries=5 --timeout=600 --max-time=21600
    profiles: [queue]
    restart: unless-stopped
    mem_limit: 256m

  clamav:
    image: clamav/clamav:1.4
    profiles: [queue]
    restart: unless-stopped
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_MaxThreads: "1"
      CLAMD_CONF_MaxQueue: "2"
      CLAMD_CONF_MaxConnectionQueueLength: "4"
      CLAMD_CONF_StreamMaxLength: "30M"
      CLAMD_CONF_MaxFileSize: "30M"
      CLAMD_CONF_MaxScanSize: "100M"
      CLAMD_CONF_MaxRecursion: "12"
      CLAMD_CONF_MaxFiles: "5000"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_ForceToDisk: "yes"
    volumes:
      - clamav-data:/var/lib/clamav
    mem_limit: 2g
    mem_reservation: 1g
    cpus: "0.75"

  scheduler:
    <<: *base
    command: php artisan schedule:work
    profiles: [scheduler]
    mem_limit: 192m

  reverb:
    <<: *base
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    profiles: [reverb]
    ports:
      - "8082:8081"
    mem_limit: 256m

networks:
  brsolutions:
    external: true

volumes:
  clamav-data:
