services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
    mysql:
        # Só no ambiente de desenvolvimento (produção usa MySQL externo).
        # Ative com COMPOSE_PROFILES=dev no .env local.
        profiles:
            - dev
        image: 'mysql:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            # Preso ao localhost — filas e cache falam pela rede interna
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        # Só no ambiente de desenvolvimento (produção usa MAIL_MAILER=log)
        profiles:
            - dev
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    evolution:
        image: 'evoapicloud/evolution-api:v2.3.7'
        ports:
            # Preso ao localhost — o Laravel fala via rede interna; nunca expor na internet
            - '127.0.0.1:${EVOLUTION_PORT:-8080}:8080'
        environment:
            AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY}'
            SERVER_URL: '${EVOLUTION_PUBLIC_URL:-http://localhost:8080}'
            DATABASE_ENABLED: 'true'
            DATABASE_PROVIDER: 'postgresql'
            DATABASE_CONNECTION_URI: 'postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public'
            DATABASE_SAVE_DATA_INSTANCE: 'true'
            DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
            DATABASE_SAVE_MESSAGE_UPDATE: 'false'
            DATABASE_SAVE_DATA_CONTACTS: 'false'
            DATABASE_SAVE_DATA_CHATS: 'false'
            CACHE_REDIS_ENABLED: 'true'
            CACHE_REDIS_URI: 'redis://redis:6379/2'
            CACHE_REDIS_PREFIX_KEY: 'evolution'
            WEBHOOK_GLOBAL_ENABLED: 'false'
            DEL_INSTANCE: 'false'
            QRCODE_LIMIT: 30
            LOG_LEVEL: 'ERROR,WARN'
        volumes:
            - 'evolution-instances:/evolution/instances'
        networks:
            - sail
        depends_on:
            - evolution-db
            - redis
        restart: unless-stopped
    evolution-db:
        image: 'postgres:16-alpine'
        environment:
            POSTGRES_DB: evolution
            POSTGRES_USER: evolution
            POSTGRES_PASSWORD: '${EVOLUTION_DB_PASSWORD}'
        volumes:
            - 'evolution-pg:/var/lib/postgresql/data'
        networks:
            - sail
        restart: unless-stopped
    reverb:
        image: sail-8.3/app
        command: php artisan reverb:start --host=0.0.0.0 --port=8081
        ports:
            # Preso ao localhost — em produção o nginx faz o proxy wss para cá
            - '127.0.0.1:${REVERB_SERVER_PORT:-8081}:8081'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
        restart: unless-stopped
    queue:
        image: sail-8.3/app
        command: php artisan queue:work redis --queue=whatsapp,default --tries=5 --max-time=3600
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
        restart: unless-stopped
    scheduler:
        image: sail-8.3/app
        command: php artisan schedule:work
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
        restart: unless-stopped
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    evolution-instances:
        driver: local
    evolution-pg:
        driver: local
