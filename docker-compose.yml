services:
    laravel.test:
        build:
            context: .
            dockerfile: docker/php83/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            REDIS_HOST: redis
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
    mysql:
        profiles:
            - dev
        image: 'mysql:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        profiles:
            - dev
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    evolution:
        profiles:
            - evolution
        image: 'evoapicloud/evolution-api:v2.3.7'
        ports:
            - '127.0.0.1:${EVOLUTION_PORT:-8080}:8080'
        environment:
            AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY}'
            SERVER_URL: '${EVOLUTION_PUBLIC_URL:-http://localhost:8080}'
            DATABASE_ENABLED: 'true'
            DATABASE_PROVIDER: 'postgresql'
            DATABASE_CONNECTION_URI: 'postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public'
            DATABASE_SAVE_DATA_INSTANCE: 'true'
            DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
            DATABASE_SAVE_MESSAGE_UPDATE: 'false'
            DATABASE_SAVE_DATA_CONTACTS: 'false'
            DATABASE_SAVE_DATA_CHATS: 'false'
            CACHE_REDIS_ENABLED: 'true'
            CACHE_REDIS_URI: 'redis://redis:6379/2'
            CACHE_REDIS_PREFIX_KEY: evolution
            WEBHOOK_GLOBAL_ENABLED: 'false'
            DEL_INSTANCE: 'false'
            QRCODE_LIMIT: 30
            LOG_LEVEL: 'ERROR,WARN'
        volumes:
            - 'evolution-instances:/evolution/instances'
        networks:
            - sail
        depends_on:
            - evolution-db
            - redis
        restart: unless-stopped
    evolution-db:
        profiles:
            - evolution
        image: 'postgres:16-alpine'
        environment:
            POSTGRES_DB: evolution
            POSTGRES_USER: evolution
            POSTGRES_PASSWORD: '${EVOLUTION_DB_PASSWORD}'
        volumes:
            - 'evolution-pg:/var/lib/postgresql/data'
        networks:
            - sail
        restart: unless-stopped
    reverb:
        image: sail-8.3/app
        command: php artisan reverb:start --host=0.0.0.0 --port=8081
        ports:
            - '127.0.0.1:${REVERB_SERVER_PORT:-8081}:8081'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
        restart: unless-stopped
    queue:
        image: sail-8.3/app
        # WhatsApp/Evolution pausado; jobs existentes permanecem no Redis.
        command: php artisan queue:work redis --queue=default --tries=5 --max-time=3600
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
        restart: unless-stopped
    documentos-queue:
        image: sail-8.3/app
        command: php artisan queue:work redis --queue=documentos-transfer,documentos --tries=5 --timeout=600 --max-time=21600
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            REDIS_HOST: redis
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy
            clamav:
                condition: service_healthy
        restart: unless-stopped
    documentos-scan:
        image: sail-8.3/app
        command: php artisan queue:work redis --queue=documentos-scan --tries=5 --timeout=180 --max-time=21600
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            REDIS_HOST: redis
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy
            clamav:
                condition: service_healthy
        restart: unless-stopped
    clamav:
        image: 'clamav/clamav:1.4'
        environment:
            # A VPS prioriza estabilidade: uma análise por vez e sem manter
            # duas bases de assinatura em RAM durante atualizações.
            CLAMD_CONF_ConcurrentDatabaseReload: 'no'
            CLAMD_CONF_MaxThreads: '1'
            CLAMD_CONF_MaxQueue: '2'
            CLAMD_CONF_MaxConnectionQueueLength: '4'
            # Uploads da aplicação têm no máximo 25 MiB. Conteúdo expandido
            # acima destes limites é bloqueado por AlertExceedsMax.
            CLAMD_CONF_StreamMaxLength: '30M'
            CLAMD_CONF_MaxFileSize: '30M'
            CLAMD_CONF_MaxScanSize: '100M'
            CLAMD_CONF_MaxRecursion: '12'
            CLAMD_CONF_MaxFiles: '5000'
            CLAMD_CONF_AlertExceedsMax: 'yes'
            # Troca pressão de memória por I/O temporário em disco.
            CLAMD_CONF_ForceToDisk: 'yes'
        volumes:
            - 'clamav-data:/var/lib/clamav'
        networks:
            - sail
        mem_limit: 2g
        mem_reservation: 1g
        cpus: '0.75'
        restart: unless-stopped
    scheduler:
        image: sail-8.3/app
        command: php artisan schedule:work
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            REDIS_HOST: redis
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
        restart: unless-stopped
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    evolution-instances:
        driver: local
    evolution-pg:
        driver: local
    clamav-data:
        driver: local
